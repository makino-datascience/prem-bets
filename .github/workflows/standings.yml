name: Update EPL table

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the table
        id: table
        continue-on-error: true
        run: python scripts/fetch_standings.py
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - name: Fetch the news
        id: news
        continue-on-error: true
        run: python scripts/fetch_news.py
      - name: Save it if anything changed
        run: |
          git config user.name "standings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standings.json news.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update EPL table and news"
            git push
          fi
      - name: Report a failed fetch
        if: steps.table.outcome == 'failure' || steps.news.outcome == 'failure'
        run: |
          echo "Table: ${{ steps.table.outcome }}  News: ${{ steps.news.outcome }}"
          exit 1
